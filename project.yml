name: TypeTop
options:
  bundleIdPrefix: com.typetop
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.2"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true
    # 使用固定的開發憑證簽章，讓 TCC 權限（麥克風/輔助使用）在重新編譯後仍有效
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: V7YS73GCG4
    PRODUCT_BUNDLE_IDENTIFIER: com.typetop.app

schemes:
  TypeTop:
    build:
      targets:
        TypeTop: all

targets:
  TypeTop:
    type: application
    platform: macOS
    sources:
      - TypeTop
    settings:
      base:
        INFOPLIST_FILE: TypeTop/Resources/Info.plist
        PRODUCT_NAME: TypeTop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: false
        CODE_SIGN_ENTITLEMENTS: TypeTop/Resources/TypeTop.entitlements
    entitlements:
      path: TypeTop/Resources/TypeTop.entitlements
      properties:
        com.apple.security.device.audio-input: true
